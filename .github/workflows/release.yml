name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build CLI ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os == 'darwin' && 'macos-latest' || 'windows-latest' }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Binary (macOS)
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=1 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/opennexus-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/server

      - name: Build Binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = "${{ matrix.os }}"
          $env:GOARCH = "${{ matrix.arch }}"
          $env:CGO_ENABLED = "0"
          go build -tags=sqlite_nocgo `
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" `
            -o "dist/opennexus-${{ matrix.os }}-${{ matrix.arch }}.exe" ./cmd/server

      - name: Package CLI (macOS)
        if: matrix.os != 'windows'
        run: |
          cd dist
          tar czf "opennexus-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "opennexus-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Package CLI (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/opennexus-${{ matrix.os }}-${{ matrix.arch }}.exe" `
            -DestinationPath "dist/opennexus-${{ matrix.os }}-${{ matrix.arch }}.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennexus-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # ========== Electron 桌面客户端（唯一桌面打包方案）==========
  # 覆盖 macOS arm64/x64 (.dmg)、Linux x64 (.AppImage)、Windows x64 (.exe)。
  # 独立 job：自带前端+后端构建，不依赖 CLI 构建，产物直接进 Release。
  electron:
    name: Electron ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
            goarch: arm64
            ebArch: arm64
          - target: macos-x64
            runner: macos-latest
            goarch: amd64
            ebArch: x64
          - target: linux-x64
            runner: ubuntu-latest
            goarch: amd64
            ebArch: x64
          - target: windows-x64
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json

      # CI runner 在国外，使用项目 .npmrc 里的国内镜像反而更慢/不稳定，临时移除
      - name: Remove China mirror config (CI)
        shell: bash
        run: rm -f electron/.npmrc

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      # Go 后端：macOS 用 CGO+真 SQLite（arm64 原生 / amd64 交叉编译）；
      # Linux 原生 CGO SQLite；Windows 用纯 Go SQLite（无 gcc 依赖）
      - name: Build Backend (macOS)
        if: startsWith(matrix.target, 'macos-')
        run: |
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o opennexus ./cmd/server

      - name: Build Backend (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o opennexus ./cmd/server

      - name: Build Backend (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -tags=sqlite_nocgo `
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" `
            -o opennexus.exe ./cmd/server

      # electron-builder 要求 package.json 的 version 是合法 semver（去掉 tag 前缀 v）
      - name: Set app version
        shell: bash
        run: |
          # tag 推送：用 tag 去掉 v 前缀作为正式版本；main 等分支推送：
          # 回退为 0.0.0-dev.<short-sha>（合法 semver 预发版），避免 electron-builder 报错。
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          node -e "const fs=require('fs');const p=require('./electron/package.json');p.version='$VERSION';fs.writeFileSync('./electron/package.json',JSON.stringify(p,null,2))"
          cat electron/package.json

      - name: Install & Build (macOS)
        if: startsWith(matrix.target, 'macos-')
        working-directory: electron
        env:
          # 用 MAC_ 前缀传入，避免把空的 CSC_LINK 直接暴露给 electron-builder
          # （空 CSC_LINK 会被当成证书文件路径，报 "not a file" 导致 mac 构建失败）
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm install --no-audit --no-fund
          if [ -n "$MAC_CSC_LINK" ]; then
            # 配置了签名证书：启用签名（notarize.cjs 再按 APPLE_* 是否配置决定公证）
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            # 未配置证书：显式关闭签名自动发现，产出未签名 .dmg（否则空 CSC_LINK 会报错）
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --${{ matrix.ebArch }}

      - name: Install & Build (Linux)
        if: matrix.target == 'linux-x64'
        working-directory: electron
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --linux --x64

      - name: Install & Build (Windows)
        if: matrix.target == 'windows-x64'
        working-directory: electron
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --x64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennexus-electron-${{ matrix.target }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.yml
          if-no-files-found: error

  # ========== Docker 镜像：推送到 GitHub Container Registry (ghcr.io) ==========
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # 仅 tag 推送时推送镜像；main 分支仅构建验证不发布
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    needs: [build, electron]
    # 仅 tag 推送才创建正式 Release；main 分支推送只跑构建验证
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 仅下载发布所需产物，排除 docker/build-push-action 自动上传的
          # `*.dockerbuild`（名字含 ~，会干扰下载全部 artifact）
          pattern: opennexus-*

      - name: Generate Release Notes
        run: |
          {
            echo "## openNexus ${{ github.ref_name }}"
            echo ""
            echo "### 桌面客户端（Electron）"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| macOS Apple Silicon | \`openNexus-*-arm64.dmg\` | 双击安装，拖入 Applications |"
            echo "| macOS Intel | \`openNexus-*-x64.dmg\` | 双击安装，拖入 Applications |"
            echo "| Linux x86_64 | \`openNexus-*.AppImage\` | \`chmod +x\` 后运行 |"
            echo "| Windows x86_64 | \`openNexus-*-x64.exe\` | 双击 NSIS 安装程序 |"
            echo ""
            echo "### 命令行版本"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| macOS Apple Silicon | \`opennexus-darwin-arm64.tar.gz\` | 命令行运行 |"
            echo "| Windows x86_64 | \`opennexus-windows-amd64.zip\` | 命令行运行 |"
            echo ""
            echo "### 使用方式"
            echo ""
            echo "- **Electron macOS**：下载 \`.dmg\`，拖拽安装到 Applications 后启动"
            echo "- **Electron Windows**：下载 \`.exe\`，按安装向导完成"
            echo "- **Electron Linux**：下载 \`.AppImage\`，\`chmod +x\` 后运行"
            echo "- **命令行版**：解压后执行 \`./opennexus\`，浏览器访问 http://127.0.0.1:8008"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: openNexus ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          draft: false
          prerelease: false
