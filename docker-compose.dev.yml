# docker-compose.dev.yml
# 开发用编排：镜像内置 Go 工具链，供容器内 coding agent 编译/运行 Go 代码。
# 用法：
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  opennexus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: opennexus:dev
    container_name: opennexus-dev
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      # 容器内 HOME 与宿主机对齐（见 environment.HOME），挂载点统一用 ${HOME}：
      # 容器内外绝对路径完全相同，会话工作区路径两边都可达，避免目录混乱。
      - ${HOME}/.openNexus:${HOME}/.openNexus
      # 容器用 *.npm-linux / *.npm-global-linux 与宿主机 macOS 的 npm 缓存物理隔离：
      # npx 调用的 claude-agent-acp 依赖原生二进制，跨 macOS/Linux 共享会崩溃。
      - ${HOME}/.npm-linux:${HOME}/.npm-linux
      - ${HOME}/.npm-global-linux:${HOME}/.npm-global-linux
      # Go module / build 缓存复用宿主机，避免容器重启后重新拉取依赖
      - ${HOME}/go:${HOME}/go
      # 外部下载的 Linux CLI（二进制由宿主机准备，容器内只读使用）
      - ./bin:/opt/opennexus/bin:ro
      # 以下与 docker-compose.yml 保持一致，确保关键用户目录在 dev 容器中也可用
      - ${HOME}/src:${HOME}/src
      - ${HOME}/.config:${HOME}/.config
      # 挂载本地 ~/.local：使 agent 子进程能使用 ~/.local/bin 下的工具及 ~/.local/share 下的配置/数据。
      - ${HOME}/.local:${HOME}/.local
    environment:
      # 关键：容器内 HOME 注入为宿主机 HOME，让 ~ 路径与挂载点完全一致，
      # 消除工作区绝对路径在容器/宿主机之间的错位。
      - HOME=${HOME}
      - SERVER_MODE=release
      - SERVER_PORT=8008
      - JWT_SECRET=${JWT_SECRET:-nexusagent-dev-secret-key-32+bytes!}
      # 默认时区
      - TZ=Asia/Shanghai
      # Go 环境（PATH/GOPATH 已在镜像内设置，这里补充常用环境变量）
      - GOPATH=${HOME}/go
      - GOFLAGS=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
