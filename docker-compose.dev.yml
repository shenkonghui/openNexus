# docker-compose.dev.yml
# 开发用编排：镜像内置 Go 工具链，供容器内 coding agent 编译/运行 Go 代码。
# 用法：
#   docker compose -f docker-compose.dev.yml up -d --build
services:
  opennexus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: opennexus:dev
    container_name: opennexus-dev
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      # 单人开发环境：一次性挂载整个 HOME，保持容器/宿主机路径完全一致
      - ${HOME}:${HOME}
      # 容器用 Linux npm 缓存，覆盖掉上方 HOME 挂载中的 macOS npm
      # 避免 npx 调用的原生二进制（如 claude-agent-acp）跨平台崩溃
      - ${HOME}/.npm-linux:${HOME}/.npm-linux
      - ${HOME}/.npm-global-linux:${HOME}/.npm-global-linux
      # 外部下载的 Linux CLI（二进制由宿主机准备，容器内只读使用）
      - ./bin:/opt/opennexus/bin:ro
      # 挂载宿主机 docker socket：容器内 docker CLI 直接管理宿主机容器
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # 将容器进程加入宿主机的 docker 组，保证对 docker.sock 的访问权限
      - docker
    environment:
      # 关键：容器内 HOME 注入为宿主机 HOME，让 ~ 路径与挂载点完全一致，
      # 消除工作区绝对路径在容器/宿主机之间的错位。
      - HOME=${HOME}
      - SERVER_MODE=release
      - SERVER_PORT=8008
      - JWT_SECRET=${JWT_SECRET:-nexusagent-dev-secret-key-32+bytes!}
      # 默认时区
      - TZ=Asia/Shanghai
      # Go 环境（PATH/GOPATH 已在镜像内设置，这里补充常用环境变量）
      - GOPATH=${HOME}/go
      - GOFLAGS=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
