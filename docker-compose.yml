services:
  opennexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennexus:latest
    container_name: opennexus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 挂载本地 ~/.openNexus：容器与宿主机共享同一份数据（db、会话、agent 二进制缓存、config.yaml），
      # 本地直接运行 opennexus 和容器运行的数据完全一致。
      - ${HOME}/.openNexus:/root/.openNexus
      - opennexus-npm-cache:/root/.npm
      - ${HOME}/src:${HOME}/src
      - ${HOME}/.config:${HOME}/.config
    environment:
      - SERVER_MODE=release
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-nexusagent-dev-secret-key-32+bytes!}
      # 默认时区
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opennexus-npm-cache:
