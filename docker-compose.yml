services:
  opennexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennexus:latest
    container_name: opennexus
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      # 容器内 HOME 与宿主机对齐（见 environment.HOME），因此所有挂载点都用 ${HOME}：
      # 容器内外绝对路径完全相同，DB / 会话工作区里存储的路径两边都可达，
      # 不会出现「容器建的会话宿主机打不开、宿主机建的会话容器打不开」的目录混乱。
      - ${HOME}/.openNexus:${HOME}/.openNexus
      # 容器用 *.npm-linux / *.npm-global-linux 与宿主机 macOS 的 npm 缓存物理隔离：
      # npx 调用的 claude-agent-acp 依赖原生二进制，跨 macOS/Linux 共享会崩溃。
      - ${HOME}/.npm-linux:${HOME}/.npm-linux
      - ${HOME}/.npm-global-linux:${HOME}/.npm-global-linux
      - ${HOME}/src:${HOME}/src
      - ${HOME}/.config:${HOME}/.config
      # 挂载本地 ~/.local：使 agent 子进程能使用 ~/.local/bin 下的工具及 ~/.local/share 下的配置/数据。
      - ${HOME}/.local:${HOME}/.local
      # 挂载宿主机 docker socket：容器内 docker CLI 直接管理宿主机容器（agent 使用）。
      # 容器内进程以 root 运行，可读写该 socket；谨慎暴露，仅用于受信任的环境。
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # 将容器进程加入宿主机的 docker 组，保证对 docker.sock 的访问权限
      - docker
    environment:
      # 关键：容器内 HOME 注入为宿主机 HOME，让 ~/.openNexus / ~/src 等 ~ 路径
      # 与挂载点完全一致，消除工作区绝对路径在容器/宿主机之间的错位。
      - HOME=${HOME}
      - SERVER_MODE=release
      - SERVER_PORT=8008
      - JWT_SECRET=${JWT_SECRET:-nexusagent-dev-secret-key-32+bytes!}
      # 默认时区
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
