services:
  opennexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: opennexus:latest
    container_name: opennexus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/root/.openNexus
      - opennexus-npm-cache:/root/.npm
      # 挂载宿主机 root/home：容器内 agent 可直接访问宿主机用户目录，工作区路径与宿主机一致
      # （更具体的 /root/.openNexus、/root/.npm 挂载会叠加在其上，互不影响）
      - /root:/root
      - /home:/home
    environment:
      - SERVER_MODE=release
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-nexusagent-dev-secret-key-32+bytes!}
      # 默认时区
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opennexus-npm-cache:
